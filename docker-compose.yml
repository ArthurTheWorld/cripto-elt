name: cripto-elt

x-airflow-common: &airflow-common
  build:
    context: ./docker/airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "30"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    PYTHONPATH: /opt/airflow
    TZ: America/Sao_Paulo
    # ---- Data lake (API S3) ----
    S3_ENDPOINT: ${S3_ENDPOINT:-rustfs:9000}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-admin12345}
    S3_BUCKET: ${S3_BUCKET:-bronze}
    S3_SECURE: "false"
    # ---- Postgres do Data Warehouse ----
    DW_HOST: ${DW_HOST:-dw}
    DW_PORT: "5432"
    DW_DB: ${DW_DB:-warehouse}
    DW_USER: ${DW_USER:-dw}
    DW_PASSWORD: ${DW_PASSWORD:-dw12345}
    # ---- API de origem ----
    COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
    COINGECKO_API_URL: ${COINGECKO_API_URL:-https://api.coingecko.com/api/v3/coins/markets}
    COINGECKO_PER_PAGE: ${COINGECKO_PER_PAGE:-100}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./etl:/opt/airflow/etl
    - ./dbt:/opt/airflow/dbt
    - ./logs:/opt/airflow/logs
  restart: unless-stopped

services:
  # ==========================================================
  # Metadados do Airflow (não guarda dados de negócio)
  # ==========================================================
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ==========================================================
  # Data Warehouse analítico (camadas raw/staging/marts do dbt)
  # ==========================================================
  dw:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DW_USER:-dw}
      POSTGRES_PASSWORD: ${DW_PASSWORD:-dw12345}
      POSTGRES_DB: ${DW_DB:-warehouse}
    ports:
      - "5433:5432"          # acesse de fora com DBeaver/psql na porta 5433
    volumes:
      - dw_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DW_USER:-dw} -d ${DW_DB:-warehouse}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ==========================================================
  # Data lake (camada bronze): guarda o JSON cru da API.
  #
  # RustFS substitui o MinIO, que descontinuou o open source e
  # removeu as imagens publicas do Docker Hub. A API e compativel
  # com S3, entao o mesmo codigo (boto3) roda em AWS/GCS depois.
  # ==========================================================
  rustfs:
    image: rustfs/rustfs:1.0.4
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-admin12345}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: "error"
    ports:
      - "9000:9000"          # API S3
      - "9001:9001"          # console web
    volumes:
      - rustfs_data:/data

  # ==========================================================
  # Airflow
  # ==========================================================
  airflow-init:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
      dw:
        condition: service_healthy
      rustfs:
        condition: service_started
    command:
      - bash
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username admin --firstname Admin --lastname Dados \
          --role Admin --email admin@exemplo.com --password admin || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      dw:
        condition: service_healthy
      rustfs:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      dw:
        condition: service_healthy
      rustfs:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  dw_data:
  rustfs_data:
