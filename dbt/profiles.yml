# Conexão do dbt com o Postgres do data warehouse.
# Nenhum segredo aqui: tudo vem de variáveis de ambiente (docker-compose/.env).
cripto_elt:
  target: prod
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DW_HOST', 'localhost') }}"
      port: "{{ env_var('DW_PORT', '5432') | as_number }}"
      user: "{{ env_var('DW_USER', 'dw') }}"
      password: "{{ env_var('DW_PASSWORD', 'dw12345') }}"
      dbname: "{{ env_var('DW_DB', 'warehouse') }}"
      schema: analytics
      threads: 4
      connect_timeout: 10

    prod:
      type: postgres
      host: "{{ env_var('DW_HOST', 'localhost') }}"
      port: "{{ env_var('DW_PORT', '5432') | as_number }}"
      user: "{{ env_var('DW_USER', 'dw') }}"
      password: "{{ env_var('DW_PASSWORD', 'dw12345') }}"
      dbname: "{{ env_var('DW_DB', 'warehouse') }}"
      schema: analytics
      threads: 4
      connect_timeout: 10
